<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Converter Celsius to Fahrenheit" />
  <meta name="keywords" content="converter, calculator, celsius, fahrenheit" />
  <title>Kiyan Converter | °C to °F</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="./img/thermometerIco.png" type="image/png" />

  <link href="style/style.css" rel="stylesheet" />
</head>

<body>
  <main class="main">
    <label for="converter" class="title">
      Converter <span class="c">°C</span> to <span class="F">°F</span>
    </label>

    <input type="text" id="converter" placeholder="°C" autocomplete="off" aria-label="Temperature value" />

    <p class="result"></p>

    <div id="buttons">
      <button class="convertButton" type="button">Convert</button>
      <button class="resetButton" type="button">Reset</button>
      <button class="changeButton" type="button">Change</button>
    </div>
  </main>

  <script src="./js/script.js"></script>
</body>
</html>
